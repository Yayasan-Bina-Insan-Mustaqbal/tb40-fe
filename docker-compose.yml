version: '3.8'

services:
  pocketbase:
    image: ghcr.io/muchll/pocketbase:latest
    container_name: pocketbase-tb40
    restart: always
    command: serve --http=0.0.0.0:8090
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
    networks:
      - tb40-network

  api:
    build:
      context: ../api-tb40-explore
      dockerfile: Dockerfile
    container_name: api-tb40
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4040
      - POCKETBASE_URL=http://pocketbase:8090
    ports:
      - "4040:4040"
    depends_on:
      - pocketbase
    networks:
      - tb40-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tb40-frontend
    restart: always
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:4040
    ports:
      - "3030:3030"
    depends_on:
      - api
    networks:
      - tb40-network

networks:
  tb40-network:
    driver: bridge

volumes:
  pb_data:
